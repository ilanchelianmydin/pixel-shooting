<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Animation - Completed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(to bottom right, #0f172a, #1e3a8a, #581c87);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 256px;
      background: linear-gradient(to bottom right, #0f172a, #1e3a8a, #581c87);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px;
      overflow: hidden;
      position: relative;
    }

    .character {
      position: relative;
      z-index: 10;
    }

    .pixel {
      width: 8px;
      height: 8px;
      display: inline-block;
    }

    .pixel-row {
      display: flex;
      height: 8px;
    }

    .pixel-orange {
      background-color: #f97316;
    }

    .glow-particle {
      position: absolute;
      background-color: #fde047;
      opacity: 0.6;
      border-radius: 50%;
      animation: pulse 0.4s ease-in-out infinite;
    }

    .beam-container {
      position: absolute;
      left: 80px;
      top: 50%;
      transform: translateY(-50%);
      width: calc(100% - 80px);
      height: 40px;
      overflow: visible;
      display: none;
    }

    .beam-container.active {
      display: block;
    }

    .beam-main {
      height: 40px;
      background: linear-gradient(to right, #67e8f9, #60a5fa, #3b82f6);
      width: 100%;
      animation: beamExpand 1.2s ease-out forwards, beamPulse 0.15s ease-in-out infinite;
      box-shadow: 0 0 30px #00ffff, 0 0 60px #0088ff;
      transform-origin: left center;
    }

    .beam-core {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 0;
      height: 24px;
      background-color: white;
      opacity: 0.7;
      width: 100%;
      animation: beamExpand 1.2s ease-out forwards;
      box-shadow: 0 0 20px #ffffff;
      transform-origin: left center;
    }

    .beam-particle {
      position: absolute;
      background-color: #a5f3fc;
      border-radius: 50%;
      opacity: 0.8;
      animation: particleFlow 0.4s linear infinite;
    }

    .completed-text {
      color: #4ade80;
      font-weight: bold;
      font-size: 36px;
      letter-spacing: 0.05em;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 20;
      animation: completedPop 0.5s ease-out;
    }

    .completed-text.show {
      display: flex;
    }

    .checkmark {
      font-size: 48px;
    }

    @keyframes beamExpand {
      0% { 
        transform: scaleX(0);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% { 
        transform: scaleX(1);
        opacity: 1;
      }
    }

    @keyframes beamPulse {
      0%, 100% { 
        filter: brightness(1);
      }
      50% { 
        filter: brightness(1.3);
      }
    }

    @keyframes particleFlow {
      0% { 
        transform: translateX(-20px) scale(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% { 
        transform: translateX(20px) scale(1);
        opacity: 0;
      }
    }

    @keyframes completedPop {
      0% { 
        transform: scale(0) rotate(-10deg);
        opacity: 0;
      }
      60% { 
        transform: scale(1.2) rotate(5deg);
        opacity: 1;
      }
      100% { 
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 0.6;
      }
      50% { 
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="character" id="character"></div>
    <div class="beam-container" id="beamContainer">
      <div class="beam-main"></div>
      <div class="beam-core"></div>
      <div id="particles"></div>
    </div>
    <div class="completed-text" id="completedText">
      <span class="checkmark">✓</span>
      <span>Completed</span>
    </div>
  </div>

  <script>
    const sprites = {
      rest: [
        '    ████    ',
        '   ██████   ',
        '   ██████   ',
        '  ████████  ',
        '  ████████  ',
        '  ████████  ',
        '  ██████    ',
        '  ██  ██    ',
        '  ██  ██    ',
        ' ███  ███   ',
      ],
      awake: [
        '    ████    ',
        '   ██████   ',
        '   ██████   ',
        '  ████████  ',
        '  ██████    ',
        ' ███████    ',
        '  ██████    ',
        '  ██  ██    ',
        '  ██  ██    ',
        ' ███  ███   ',
      ],
      attack1: [
        '    ████    ',
        '   ██████   ',
        '   ██████   ',
        '  ████████  ',
        '   ██████   ',
        '   ██████   ',
        '  ████████  ',
        '  ██  ██    ',
        '  ██  ██    ',
        ' ███  ███   ',
      ],
      attack2: [
        '    ████    ',
        '   ██████   ',
        '   ██████   ',
        '  ████████  ',
        '   ██████   ',
        '    ████    ',
        '  ████████  ',
        '  ██  ██    ',
        '  ██  ██    ',
        ' ███  ███   ',
      ]
    };

    let phase = 'rest';
    let attackFrame = 0;
    let glowParticles = [];

    function renderSprite(spriteName) {
      const character = document.getElementById('character');
      character.innerHTML = '';
      
      const sprite = sprites[spriteName];
      sprite.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'pixel-row';
        row.split('').forEach(pixel => {
          const pixelDiv = document.createElement('div');
          pixelDiv.className = pixel === '█' ? 'pixel pixel-orange' : 'pixel';
          rowDiv.appendChild(pixelDiv);
        });
        character.appendChild(rowDiv);
      });
    }

    function createGlowParticles() {
      const character = document.getElementById('character');
      glowParticles.forEach(p => p.remove());
      glowParticles = [];

      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'glow-particle';
        particle.style.width = (Math.random() * 24 + 12) + 'px';
        particle.style.height = (Math.random() * 24 + 12) + 'px';
        particle.style.left = (Math.random() * 100) + '%';
        particle.style.top = (Math.random() * 100) + '%';
        particle.style.animationDuration = (Math.random() * 0.4 + 0.3) + 's';
        character.style.position = 'relative';
        character.appendChild(particle);
        glowParticles.push(particle);
      }
    }

    function createBeamParticles() {
      const container = document.getElementById('particles');
      container.innerHTML = '';
      
      for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'beam-particle';
        particle.style.width = (Math.random() * 8 + 4) + 'px';
        particle.style.height = (Math.random() * 8 + 4) + 'px';
        particle.style.left = (Math.random() * 90 + 5) + '%';
        particle.style.top = ((Math.random() - 0.5) * 80 + 50) + '%';
        particle.style.animationDuration = (Math.random() * 0.4 + 0.3) + 's';
        container.appendChild(particle);
      }
    }

    function removeGlowParticles() {
      glowParticles.forEach(p => p.remove());
      glowParticles = [];
    }

    async function animate() {
      // Phase 1: Rest
      phase = 'rest';
      renderSprite('rest');
      document.getElementById('beamContainer').classList.remove('active');
      document.getElementById('completedText').classList.remove('show');
      await sleep(2000);

      // Phase 2: Wake
      phase = 'waking';
      renderSprite('awake');
      await sleep(600);

      // Phase 2: Glow
      phase = 'glowing';
      createGlowParticles();
      await sleep(1000);

      // Phase 3: Shoot
      phase = 'shooting';
      renderSprite('attack1');
      document.getElementById('beamContainer').classList.add('active');
      createBeamParticles();
      
      // Animate between attack frames
      let frameInterval = setInterval(() => {
        attackFrame = (attackFrame + 1) % 2;
        renderSprite(attackFrame === 0 ? 'attack1' : 'attack2');
      }, 200);

      await sleep(1500);
      clearInterval(frameInterval);

      // Phase 4: Completed
      phase = 'completed';
      removeGlowParticles();
      document.getElementById('beamContainer').classList.remove('active');
      document.getElementById('completedText').classList.add('show');
      await sleep(2000);

      // Loop
      animate();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Start animation
    animate();
  </script>
</body>
</html>
